name: Feature request
description: Suggest an editor or review improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today?
      description: Describe the task and the current friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what pane-md should do and on which platforms.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
