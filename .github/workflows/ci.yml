name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tracked files and MCP configuration
        run: |
          python3 .repo-safety/scripts/forbid_sensitive_files.py --all
          python3 .repo-safety/scripts/scan_mcp_config.py
      - name: Check release tag against Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo.toml v{version}')
          PY
      - name: Check release notes
        if: github.ref_type == 'tag'
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            artifact: windows-x64
            archive: target/release/pane-md-windows-x64.zip
          - runner: ubuntu-24.04
            artifact: linux-x64
            archive: target/release/pane-md-linux-x64.tar.gz
          - runner: macos-15
            artifact: macos-universal
            archive: target/release/pane-md-macos-universal.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.95.0
      - name: Install macOS build targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked --all-targets
      - name: Test CLI and MCP without GUI dependencies
        if: runner.os != 'Windows'
        run: cargo test --locked --all-targets --no-default-features
      - name: Test packaging metadata
        run: python scripts/test-packaging.py
      - name: Validate Linux launcher
        if: runner.os == 'Linux'
        run: desktop-file-validate assets/pane-md.desktop
      - name: Test portable browser components
        if: runner.os == 'Linux'
        run: |
          node --check src/portable/app.js
          python scripts/test-source-pane.py
          python scripts/test-remote-image.py
      - name: Build and package Windows
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          python scripts/package-windows.py
          $details = (Get-Item target/release/pane-md.exe).VersionInfo
          $expected = (& ./target/release/pane-md.exe --version).Split(' ')[1]
          if ($details.ProductName -ne 'pane-md' -or $details.ProductVersion -ne $expected -or $details.FileDescription -ne 'pane-md Markdown editor') {
            throw "Windows version resource does not match pane-md $expected"
          }
      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          python scripts/package-linux.py
      - name: Build and package macOS universal app
        if: runner.os == 'macOS'
        run: python scripts/package-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: pane-md-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pane-md-*
          path: dist
          merge-multiple: true
      - name: Verify assets and write SHA-256 checksums
        run: |
          test -f dist/pane-md-windows-x64.zip
          test -f dist/pane-md-linux-x64.tar.gz
          test -f dist/pane-md-macos-universal.zip
          cd dist
          sha256sum pane-md-* > SHA256SUMS.txt
      - name: Prepare release notes
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
