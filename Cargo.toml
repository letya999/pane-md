[package]
name = "notepad-md"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
comrak = { version = "0.55", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.2"

[target.'cfg(windows)'.dependencies]
mermaid-svg = "0.7"
resvg = { version = "0.50", default-features = false, features = ["system-fonts", "text"] }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Imaging",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry",
    "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
